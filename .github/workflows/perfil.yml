# Actualiza cada día la serpiente de contribuciones y las tarjetas de estadísticas del perfil.
name: Perfil

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/perfil.yml"]

permissions:
  contents: write

concurrency: perfil

jobs:
  serpiente:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/serpiente.svg?palette=github-light&color_snake=#ff8a5c
            dist/serpiente-oscura.svg?palette=github-dark&color_snake=#ff8a5c
      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  tarjetas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: vn7n24fzkq/github-profile-summary-cards@v0.13.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: main
          TIME_ZONE: Europe/Madrid
          THEME: github_dark
